name: Build and test

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install lint tools
      run: pip install -r requirements-dev.txt
    - name: Ruff check
      run: ruff check mptorch tests benchmarks
    - name: Ruff format check
      run: ruff format --check mptorch tests benchmarks
    - name: ty check
      run: ty check mptorch

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        uv pip install --system setuptools
        uv pip install --system -r requirements.txt
    - name: Install mptorch library version to test
      run: |
        uv pip install --system -e ".[test]" --no-build-isolation
    - name: Test with pytest
      run: |
        pytest tests