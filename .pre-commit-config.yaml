repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check (mptorch/, tests/, benchmarks/)
        entry: ty check mptorch tests benchmarks
        language: system
        pass_filenames: false
        files: ^(mptorch|tests|benchmarks)/.*\.py$
