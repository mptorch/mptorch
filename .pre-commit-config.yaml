repos:
  # rev must match the ruff pin in pyproject.toml's dev group.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check (mptorch/, tests/, dev/benchmarks/)
        # .venv's ty, which uv.lock pins (pyproject.toml's dev group): a
        # different version reports different findings, which would read as
        # the code's. Called directly rather than through `uv run`, so a commit
        # never waits on a sync or a rebuild.
        entry: .venv/bin/ty check mptorch tests dev/benchmarks
        language: system
        pass_filenames: false
        files: ^(mptorch|tests|dev/benchmarks)/.*\.py$
